[package]
name = "svc"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
async-nats = "0.50.0"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
opentelemetry = "0.33.1"
opentelemetry-otlp = { version = "0.33.1", features = ["grpc-tonic"] }
opentelemetry_sdk = "0.33.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
svc-core = { version = "0.1.0", path = "../svc-core" }
tokio = { version = "1.53.3", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace", "cors", "compression-gzip", "timeout"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.34.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
utoipa = { version = "6.0.0", features = ["axum_extras"] }

[dev-dependencies]
criterion = "0.8.2"
http-body-util = "0.1.5"

[[bench]]
name = "notify"
harness = false
